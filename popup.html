<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h3>Blink Buddy 👁️</h3>

    <label>
      <input type="checkbox" id="toggle" />
      Enable reminders
    </label>

    <div>
      <label for="interval">Interval (minutes):</label>
      <input type="number" id="interval" min=".09" max="60" step="1" value="10" />
    </div>

    <button id="save">Save</button>

    <p id="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
